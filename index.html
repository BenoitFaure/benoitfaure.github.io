<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Benoit Faure — personal site">
  <title>Benoit Faure</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      text-align: center;
      padding: 2rem;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    .emoji {
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 1;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    h1 {
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .links {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 0.5rem;
    }

    .links a {
      color: #fff;
      text-decoration: none;
      font-size: 1rem;
      opacity: 0.7;
      transition: opacity 0.2s;
    }

    .links a:hover {
      opacity: 1;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <h1>Under Construction</h1>
    <p class="emoji" aria-hidden="true">🏗️</p>
    <div class="links">
      <a href="https://github.com/BenoitFaure" target="_blank" rel="noopener">GitHub</a>
      <a href="https://www.linkedin.com/in/benoit-faure/" target="_blank" rel="noopener">LinkedIn</a>
    </div>
  </main>
</body>
</html>
